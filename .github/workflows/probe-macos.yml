name: 探测 macOS 运行器架构

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "label=${{ matrix.os }}"
          uname -m
          sw_vers
