[package]
name = "shoes"
version = "0.3.7"
publish = false # Cargo strips fork patches from crates.io packages.
edition = "2024"
rust-version = "1.99.1"
autotests = false
autobenches = false
license = "MIT"
description = "A multi-protocol proxy server."
homepage = "https://github.com/cfal/shoes/"
repository = "https://github.com/cfal/shoes/"
readme = "README.md"
keywords = ["proxy", "proxy-server", "shadowsocks", "v2ray", "vmess"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "shoes"
# rlib = Rust library (for Rust dependencies)
# cdylib = C dynamic library (.so on Linux/Android, .dylib on macOS)
# staticlib = C static library (.a) - required for iOS
crate-type = ["rlib"]

[[bin]]
name = "shoes"
path = "src/main.rs"

[features]
default = []
ffi = []  # Enable FFI module for non-Android builds
integration-tests = []
optional-peer-tests = ["integration-tests"]
external-network-tests = ["integration-tests"]
privileged-tests = ["integration-tests"]
stress-tests = ["integration-tests"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1.92"
aws-lc-rs = { version = "1.19.0", default-features = false }
base64 = "0.23.1"
blake2 = "0.11"
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
digest = "0.11.3"
etherparse = "0.21.0"
futures = "0.3.34"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9.1"
prost = "0.14.4"
yaml-rust2 = { version = "0.13", default-features = false }
h2 = "0.4.20"
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "h3-aws-lc-rs"] }
http = "1.5.0"
httpdate = "1"
http-body-util = "0.1.5"
httparse = "1.10.1"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
hyper-tungstenite = "0.30.0"
memory-stats = "1.2.0"
indexmap = "2.14.2"
instant-acme = { version = "=0.8.5", default-features = false, features = ["aws-lc-rs", "rcgen", "time", "x509-parser"] }
ipnetwork = { version = "0.21", features = ["serde"] }
libc = "0.2.191"
log = { version = "0.4.35", features = ["std", "release_max_level_info"] }
lru = "0.19.0"
md-5 = "0.11.0"
memchr = "2.8.3"
mime_guess = "2.0.5"
ml-kem = { version = "0.3.4", features = ["zeroize"] }
notify = "8.2.1"
# 0.13's futex_time64 probe triggers SIGSYS on 32-bit Android API 26-29.
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
quinn = { version = "0.11.12", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs"] }
quinn-proto = { version = "0.11", default-features = false }
rand = "0.10.3"
rand_core = "0.10.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rust-argon2 = "3.0.0"
rustc-hash = "2.1.3"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "perf"] }
rustls = "=0.23.46"
serde = { version = "1.0.229", features = ["derive", "std"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34+deprecated"
shake = "0.1.0"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "auto-icmp-echo-reply", "socket-udp", "socket-tcp", "socket-tcp-cubic", "phy-tuntap_interface", "assembler-max-segment-count-32", "segmentation-offload"] }
socket2 = { version = "0.6.5", features = ["all"] }
sntpc = { version = "=0.11.0", default-features = false }
subtle = "2.6.1"
tendns = { version = "0.2", default-features = false }
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.20", features = ["time", "io", "rt"] }
tracing = { version = "0.1", default-features = false, features = ["release_max_level_info"] }
tun = { version = "0.8.14", features = ["async"] }
url = "2.5.8"
uuid = "1"
webpki-roots = { version = "1.0.11" }
x509-parser = { version = "0.18.1", default-features = false, features = ["verify-aws"] }
zeroize = "1.9.1"
[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
shoes-test-support = { path = "tests/support" }
tempfile = "3.27.0"
tokio-rustls = "0.26.6"
[target.'cfg(unix)'.dependencies]
gotatun = { version = "0.10.2", default-features = false, features = ["device", "aws-lc-rs"] }
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1", features = ["fallback"] }

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.24"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nftables = "0.6.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config"] }
# jemalloc for better memory performance (not supported on Windows MSVC, iOS, or Android)
[target.'cfg(not(any(target_env = "msvc", target_os = "ios", target_os = "android")))'.dependencies]
tikv-jemallocator = "0.7.0"
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
jni = "0.22"
ndk-sys = "0.6.0+11769913"
[profile.release]
opt-level = 3
lto = "fat"
strip = true

[lints.rust]
warnings = "allow"
