{% extends "shell.html" %}
{% block title %}新建密钥 · 管理后台{% endblock %}
{% block content %}
<header id="topbar"><h1>新建密钥</h1></header>

<section class="panel">
  <p class="muted"><a href="/keys">← 返回密钥</a></p>
  {% if !flash.is_empty() %}<p class="stat-error">{{ flash }}</p>{% endif %}
  <form class="edit-form" method="post" action="/keys/create">
    <label>名称<input name="name" placeholder="例如 本机脚本" required autofocus></label>
    <div class="edit-actions">
      <button type="submit">新建</button>
      <a class="btn btn--ghost" href="/keys">取消</a>
    </div>
  </form>
  <p class="muted">新建后立即显示明文，只显示这一次；绑定哪个桶可以在编辑页里改。</p>
</section>
{% endblock %}
