{% extends "shell.html" %}
{% block title %}编辑密钥 · 管理后台{% endblock %}
{% block content %}
<header id="topbar"><h1>编辑密钥</h1></header>

<section class="panel">
  <p class="muted"><a href="/keys">← 返回密钥</a></p>
  {% if !flash.is_empty() %}<p class="stat-error">{{ flash }}</p>{% endif %}
  <form class="edit-form" method="post" action="/keys/{{ id }}/edit">
    <label>名称<input name="name" value="{{ name }}" required autofocus></label>
    <label>使用的桶
      <select name="bucket_id">
        {% for bucket in buckets %}
        <option value="{{ bucket.value }}"{% if bucket.selected %} selected{% endif %}>{{ bucket.label }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="edit-actions">
      <button type="submit">保存</button>
      <a class="btn btn--ghost" href="/keys">取消</a>
    </div>
  </form>
  <p class="muted">前缀 {{ prefix }}；改成具体桶后，这个 key 只用那个桶里的账号。</p>
</section>
{% endblock %}
