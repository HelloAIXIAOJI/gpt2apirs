[package]
name = "gpt2apirs-http"
description = "wreq 封装的 TLS 指纹 HTTP 客户端 + 代理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# TLS 指纹能力。需要 BoringSSL 构建链（Windows 额外需要 NASM）。
# 未启用时本 crate 只提供骨架类型，workspace 可在无 NASM 环境下编译。
tls = [
    "dep:wreq",
    "dep:wreq-util",
    "dep:tracing-subscriber",
    # 三个 bin 都需要 tokio 运行时；带上 protocol 是因为抓包工具要复用解析逻辑
    "dep:tokio",
    "dep:gpt2apirs-core",
    "dep:serde",
    "dep:thiserror",
    "dep:uuid",
    "dep:gpt2apirs-protocol",
]

[dependencies]
gpt2apirs-core = { workspace = true, optional = true }
gpt2apirs-protocol = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }

[dev-dependencies]

[[bin]]
name = "v1-probe"
path = "src/bin/v1_probe.rs"
required-features = ["tls"]

[[bin]]
name = "v3-capture"
path = "src/bin/v3_capture.rs"
required-features = ["tls"]

[[bin]]
name = "v4-download"
path = "src/bin/v4_download.rs"
required-features = ["tls"]